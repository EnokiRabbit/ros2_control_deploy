controller_manager:
  ros__parameters:
    # Overruns on a VM are caused by missing real-time scheduling, not by the
    # control code. See the notes in the previous revision of this file:
    # use 100 Hz on a VM, 200 Hz on the real robot.
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    mit_joint_controller:
      type: ros_control_controllers/MitJointController

mit_joint_controller:
  ros__parameters:
    joints:
      - left_shoulder_pitch_joint
      - right_shoulder_pitch_joint
      - left_hip_yaw_joint
      - left_hip_roll_joint
      - left_hip_pitch_joint
      - left_knee_joint
      - left_ankle_pitch_joint
      - left_ankle_roll_joint
      - right_hip_yaw_joint
      - right_hip_roll_joint
      - right_hip_pitch_joint
      - right_knee_joint
      - right_ankle_pitch_joint
      - right_ankle_roll_joint
    command_timeout: 0.5
    damping_kd: 0.0
